            const [askSuccessMessage, setAskSuccessMessage] = useState(false);

            // Admin Auth state — linked to Firebase Authentication + admins/{uid}
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [adminEmail, setAdminEmail] = useState('');
            const [adminPassword, setAdminPassword] = useState('');
            const [adminLoginError, setAdminLoginError] = useState('');
            const [adminLoginLoading, setAdminLoginLoading] = useState(false);

            // Admin editing state
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [newQuestionForm, setNewQuestionForm] = useState({ question: '', answer: '', category: '', verse: '', source: '', keywords: '' });

            // Custom Confirm Dialog State
            const [confirmState, setConfirmState] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

            // Listen for Firebase Auth changes
            useEffect(() => {
                const checkAuthInterval = setInterval(() => {
                    if (window.firebaseAuth && window.firebaseFns) {
                        clearInterval(checkAuthInterval);
                        window.firebaseFns.onAuthStateChanged(window.firebaseAuth, (user) => {
                            if (user) {
                                setCurrentUser(user);
                                if (user.displayName) setAuthName(user.displayName);
                            } else {
                                setCurrentUser(null);
                            }
                        });
                    }
                }, 200);

                return () => clearInterval(checkAuthInterval);
            }, []);

            // Firebase Authentication Handlers
            const handleRegister = async (e) => {
                e.preventDefault();
                setAuthError('');
                if (!authEmail.trim() || !authPassword.trim() || !authName.trim()) {
                    setAuthError('يرجى ملء جميع الحقول المطلوبة.');
                    return;
                }
                if (authPassword !== authConfirmPassword) {
                    setAuthError('كلمتا المرور غير متطابقتين.');
                    return;
                }
                if (authPassword.length < 6) {
                    setAuthError('كلمة المرور قصيرة جدًا، يجب أن تكون 6 أحرف على الأقل.');
                    return;
                }

                setAuthLoading(true);
                try {
                    const { createUserWithEmailAndPassword, updateProfile } = window.firebaseFns;
                    const userCredential = await createUserWithEmailAndPassword(window.firebaseAuth, authEmail.trim(), authPassword);
                    await updateProfile(userCredential.user, { displayName: authName.trim() });
                    setCurrentUser({ ...userCredential.user, displayName: authName.trim() });
                    showToast(`أهلاً بك يا ${authName.trim()} في منصة أسئلة الزرابي! 👋🏻`);
                    setViewMode('home');
                } catch (err) {
                    let msg = 'فشل إنشاء الحساب، يجدر المحاولة لاحقاً.';
                    if (err.code === 'auth/email-already-in-use') msg = 'البريد الإلكتروني مستخدم بالفعل لحساب آخر.';
                    else if (err.code === 'auth/invalid-email') msg = 'صيغة البريد الإلكتروني غير صحيحة.';
                    else if (err.code === 'auth/weak-password') msg = 'كلمة المرور ضعيفة جداً.';
                    else if (err.code === 'auth/network-request-failed') msg = 'فشل الاتصال بالإنترنت، تأكد من اتصالك.';
                    setAuthError(msg);
                } finally {
                    setAuthLoading(false);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                if (!authEmail.trim() || !authPassword.trim()) {
                    setAuthError('يرجى إدخال البريد الإلكتروني وكلمة المرور.');
                    return;
                }

                setAuthLoading(true);
                try {
                    const { signInWithEmailAndPassword } = window.firebaseFns;
                    const userCredential = await signInWithEmailAndPassword(window.firebaseAuth, authEmail.trim(), authPassword);
                    setCurrentUser(userCredential.user);
                    showToast(`أهلاً بعودتك، ${userCredential.user.displayName || 'صديقنا العزيز'}! 👋🏻`);
                    setViewMode('home');
                } catch (err) {
                    let msg = 'فشل تسجيل الدخول، تأكد من بياناتك.';
                    if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
                        msg = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
                    } else if (err.code === 'auth/invalid-email') {
                        msg = 'البريد الإلكتروني غير صحيح.';
                    } else if (err.code === 'auth/network-request-failed') {
                        msg = 'فشل الاتصال بالشبكة، تأكد من اتصالك بالإنترنت.';
                    }
                    setAuthError(msg);
                } finally {
                    setAuthLoading(false);
                }
            };

            const handleSignOut = async () => {
                try {
                    if (window.firebaseAuth && window.firebaseFns) {
                        await window.firebaseFns.signOut(window.firebaseAuth);
                    }
                    setCurrentUser(null);
                    setViewMode('home');
                    showToast('تم تسجيل الخروج بنجاح. ننتظر عودتك قريباً! ✝️');
                } catch (e) {
                    showToast('حدث خطأ أثناء تسجيل الخروج');
                }
            };

            // Load shared data from Firestore. Favorites remain local to each device.
            useEffect(() => {
                let unsubscribeQuestions = null;
                let unsubscribeVisitorQuestions = null;
                let intervalId = null;
                let cancelled = false;

                const connectFirestore = async () => {
                    if (!window.firebaseDb || !window.firebaseFns || cancelled) return false;

                    const { collection, onSnapshot, setDoc, doc } = window.firebaseFns;

                    try {
                        unsubscribeQuestions = onSnapshot(
                            collection(window.firebaseDb, 'questions'),
                            async (snapshot) => {
                                if (snapshot.empty) {
                                    // Public users may read the bundled defaults, but only the Admin account
                                    // is allowed to seed the shared Firestore collection.
                                    setQuestions(DEFAULT_QUESTIONS);
                                    if (!isAdminLoggedIn) return;

                                    let seedQuestions = DEFAULT_QUESTIONS;
                                    const legacy = localStorage.getItem('zarabi_church_questions');
                                    if (legacy) {
                                        try {
                                            const parsed = JSON.parse(legacy);
                                            if (Array.isArray(parsed) && parsed.length > 0) seedQuestions = parsed;
                                        } catch (e) {}
                                    }

                                    await Promise.all(seedQuestions.map((q) => {
                                        const cleanQuestion = { ...q, id: String(q.id) };
                                        return setDoc(doc(window.firebaseDb, 'questions', cleanQuestion.id), cleanQuestion);
                                    }));
                                    return;
                                }

                                const sharedQuestions = snapshot.docs
                                    .map((item) => ({ ...item.data(), id: String(item.id) }))
                                    .sort((a, b) => {
                                        const aTime = a.createdAt ? new Date(a.createdAt).getTime() : Number(a.id) || 0;
                                        const bTime = b.createdAt ? new Date(b.createdAt).getTime() : Number(b.id) || 0;
                                        return bTime - aTime;
                                    });

                                setQuestions(sharedQuestions);
                            },
                            (error) => {
                                console.error('Firestore questions listener error:', error);
                                setQuestions(DEFAULT_QUESTIONS);
                                showToast('تعذر الاتصال بقاعدة الأسئلة السحابية.');
                            }
                        );

                        if (isAdminLoggedIn) {
                            unsubscribeVisitorQuestions = onSnapshot(
                                collection(window.firebaseDb, 'visitorQuestions'),
                                (snapshot) => {
                                    const sharedVisitorQuestions = snapshot.docs
                                        .map((item) => ({ ...item.data(), id: String(item.id) }))
                                        .sort((a, b) => String(b.id).localeCompare(String(a.id)));
                                    setVisitorQuestions(sharedVisitorQuestions);
                                },
                                (error) => {
                                    console.warn('Firestore visitor questions listener error:', error);
                                }
                            );
                        } else {
                            setVisitorQuestions([]);
                        }

                        return true;
                    } catch (error) {
                        console.error('Firestore connection error:', error);
                        return false;
                    }
                };

                const tryConnect = () => {
                    connectFirestore().then((connected) => {
                        if (connected && intervalId) {
                            clearInterval(intervalId);
                            intervalId = null;
                        }
                    });
                };

                tryConnect();
                intervalId = setInterval(tryConnect, 250);

                const savedFavs = localStorage.getItem('zarabi_church_favs');
                if (savedFavs) {
                    try { setFavorites(JSON.parse(savedFavs)); } catch (e) {}
                }

                return () => {
                    cancelled = true;
                    if (intervalId) clearInterval(intervalId);
                    if (unsubscribeQuestions) unsubscribeQuestions();
                    if (unsubscribeVisitorQuestions) unsubscribeVisitorQuestions();
                };
            }, [isAdminLoggedIn]);

            // Keep deep links such as #/q/123 working after Firestore data arrives.
            useEffect(() => {
                const checkHash = () => {
                    const hash = window.location.hash.replace('#/q/', '');
                    if (!hash) return;
                    const found = questions.find(q => String(q.id) === String(hash));
                    if (found) setActiveQuestion(found);
                };

                checkHash();
                window.addEventListener('hashchange', checkHash);
                return () => window.removeEventListener('hashchange', checkHash);
            }, [questions]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3200);
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setAdminLoginError('');

                if (!adminEmail.trim() || !adminPassword) {
                    setAdminLoginError('اكتب بريد حساب الخادم وكلمة المرور.');
                    return;
                }

                if (!window.firebaseAuth || !window.firebaseFns || !window.firebaseDb) {
                    setAdminLoginError('خدمات Firebase غير متاحة حالياً.');
                    return;
                }

                setAdminLoginLoading(true);
                try {
                    const { signInWithEmailAndPassword, getDoc, doc, signOut } = window.firebaseFns;
                    const credential = await signInWithEmailAndPassword(
                        window.firebaseAuth,
                        adminEmail.trim(),
                        adminPassword
                    );

                    const adminRef = doc(window.firebaseDb, 'admins', credential.user.uid);
                    const adminSnap = await getDoc(adminRef);

                    if (!adminSnap.exists() || adminSnap.data()?.admin !== true) {
                        await signOut(window.firebaseAuth);
                        setIsAdminLoggedIn(false);
                        setAdminLoginError('هذا الحساب ليس مصرحاً له بدخول لوحة الخدام.');
                        return;
                    }

                    setCurrentUser(credential.user);
                    setIsAdminLoggedIn(true);
                    setShowLoginModal(false);
                    setAdminEmail('');
                    setAdminPassword('');
                    setViewMode('admin');
                    showToast('تم تسجيل الدخول بحساب المسؤول بنجاح 🔑');
                } catch (error) {
                    console.error('Admin Firebase login error:', error);
                    let message = 'فشل تسجيل الدخول للحساب الإداري.';
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        message = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
                    } else if (error.code === 'auth/invalid-email') {
                        message = 'صيغة البريد الإلكتروني غير صحيحة.';
                    }
                    setAdminLoginError(message);
                } finally {
                    setAdminLoginLoading(false);
                }
            };

            const handleAdminSignOut = async () => {
                try {
                    if (window.firebaseAuth && window.firebaseFns) {
                        await window.firebaseFns.signOut(window.firebaseAuth);
                    }
                } catch (error) {
                    console.error('Admin sign-out error:', error);
                } finally {
                    setIsAdminLoggedIn(false);
                    setViewMode('home');
                    showToast('تم تسجيل خروج المسؤول.');
                }
            };

            // Admin Actions for Questions — all shared content is stored in Firestore.
            const handleSaveNewQuestion = async (e) => {
                e.preventDefault();
                if (!isAdminLoggedIn) { showToast('يجب تسجيل الدخول بحساب المسؤول أولاً.'); return; }
                if (!newQuestionForm.question.trim() || !newQuestionForm.answer.trim() || !newQuestionForm.category || newQuestionForm.category === '') {
                    showToast('يرجى ملء جميع الحقول الأساسية واختيار القسم');
                    return;
                }

                if (!window.firebaseDb || !window.firebaseFns) {
                    showToast('قاعدة البيانات السحابية غير متاحة حالياً.');
                    return;
                }

                const newObj = {
                    id: String(Date.now()),
                    ...newQuestionForm,
                    createdAt: new Date().toISOString()
                };

                try {
                    await window.firebaseFns.setDoc(
                        window.firebaseFns.doc(window.firebaseDb, 'questions', newObj.id),
                        newObj
                    );
                    setNewQuestionForm({ question: '', answer: '', category: '', verse: '', source: '', keywords: '' });
                    showToast('تمت إضافة السؤال إلى المنصة السحابية ✅');
                } catch (error) {
                    console.error('Firestore create question error:', error);
                    showToast('تعذر حفظ السؤال في قاعدة البيانات.');
                }
            };

            const handleUpdateQuestion = async (e) => {
                e.preventDefault();
                if (!isAdminLoggedIn) { showToast('يجب تسجيل الدخول بحساب المسؤول أولاً.'); return; }
                if (!editingQuestion) return;
                if (!editingQuestion.question.trim() || !editingQuestion.answer.trim() || !editingQuestion.category || editingQuestion.category === '') {
                    showToast('يرجى ملء جميع الحقول واختيار القسم');
                    return;
                }

                if (!window.firebaseDb || !window.firebaseFns) {
                    showToast('قاعدة البيانات السحابية غير متاحة حالياً.');
                    return;
                }

                try {
                    const savedQuestion = { ...editingQuestion, id: String(editingQuestion.id) };
                    await window.firebaseFns.setDoc(
                        window.firebaseFns.doc(window.firebaseDb, 'questions', savedQuestion.id),
                        savedQuestion
                    );
                    setEditingQuestion(null);
                    showToast('تم تعديل السؤال وحفظه على السحابة ✏️');
                } catch (error) {
                    console.error('Firestore update question error:', error);
                    showToast('تعذر حفظ تعديل السؤال.');
                }
            };

            const handleDeleteQuestion = (id) => {
                if (!isAdminLoggedIn) { showToast('يجب تسجيل الدخول بحساب المسؤول أولاً.'); return; }
                setConfirmState({
                    isOpen: true,
                    title: 'حذف السؤال',
                    message: 'هل أنت متأكد من حذف هذا السؤال نهائياً من المنصة؟',
                    onConfirm: async () => {
                        if (!window.firebaseDb || !window.firebaseFns) {
                            showToast('قاعدة البيانات السحابية غير متاحة حالياً.');
                            return;
                        }

                        try {
                            await window.firebaseFns.deleteDoc(
                                window.firebaseFns.doc(window.firebaseDb, 'questions', String(id))
                            );
                            setConfirmState({ isOpen: false });
                            showToast('تم حذف السؤال من المنصة السحابية');
                        } catch (error) {
                            console.error('Firestore delete question error:', error);
                            setConfirmState({ isOpen: false });
                            showToast('تعذر حذف السؤال من قاعدة البيانات.');
                        }
                    }
                });
            };

            const handleSubmitVisitorQuestion = async (e) => {
                e.preventDefault();
                if (!askQuestionText.trim() || !askCategory || askCategory === '') {
                    showToast('يرجى كتابة السؤال واختيار القسم');
                    return;
                }

                if (!window.firebaseDb || !window.firebaseFns) {
                    showToast('قاعدة البيانات السحابية غير متاحة حالياً.');
                    return;
                }

                const newQuestionObject = {
                    id: String(Date.now()),
                    question: askQuestionText.trim(),
                    visitorName: currentUser?.displayName || askVisitorName.trim() || 'زائر كريم',
                    category: askCategory,
                    date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    createdAt: new Date().toISOString(),
                    status: 'pending'
                };

                try {
                    await window.firebaseFns.setDoc(
                        window.firebaseFns.doc(window.firebaseDb, 'visitorQuestions', newQuestionObject.id),
                        newQuestionObject
                    );

                    setAskSuccessMessage(true);
                    setAskQuestionText('');
                    setAskVisitorName('');
                    setAskCategory('');
                    showToast('تم إرسال سؤالك وحفظه في قاعدة البيانات بنجاح ✝️');
                } catch (error) {
                    console.error('Firestore visitor question error:', error);
                    showToast('تعذر إرسال السؤال الآن، حاول مرة أخرى.');
                }
            };

            const categories = useMemo(() => {
                const set = new Set();
                questions.forEach(q => {
                    if (q.category && q.category.trim()) {
                        set.add(q.category.trim());
                    }
                });
                return Array.from(set);
            }, [questions]);

            const filteredQuestions = useMemo(() => {
                return questions.filter(q => {
                    const matchesCategory = selectedCategory === 'الكل' || q.category === selectedCategory;
                    const query = searchQuery.trim().toLowerCase();
                    if (!query) return matchesCategory;

                    const inQuestion = q.question && q.question.toLowerCase().includes(query);
                    const inAnswer = q.answer && q.answer.toLowerCase().includes(query);
                    const inCategory = q.category && q.category.toLowerCase().includes(query);
                    const inKeywords = q.keywords && q.keywords.toLowerCase().includes(query);

                    return matchesCategory && (inQuestion || inAnswer || inCategory || inKeywords);
                });
            }, [questions, selectedCategory, searchQuery]);

            const questionOfTheDay = useMemo(() => {
                if (questions.length === 0) return null;
                const today = new Date().toISOString().slice(0, 10);
                let hash = 0;
                for (let i = 0; i < today.length; i++) {
                    hash = today.charCodeAt(i) + ((hash << 5) - hash);
                }
                const index = Math.abs(hash) % questions.length;
                return questions[index];
            }, [questions]);

            const toggleFavorite = (qId, e) => {
                if (e) e.stopPropagation();
                let updated;
                if (favorites.includes(qId)) {
                    updated = favorites.filter(id => id !== qId);
                    showToast('تمت إزالة السؤال من المفضلة');
                } else {
                    updated = [...favorites, qId];
                    showToast('تم حفظ السؤال في المفضلة ⭐');
                }
                setFavorites(updated);
                localStorage.setItem('zarabi_church_favs', JSON.stringify(updated));
            };

            const pickRandomQuestion = () => {
                if (questions.length === 0) return;
                const randomIndex = Math.floor(Math.random() * questions.length);
                const randomQ = questions[randomIndex];
                setActiveQuestion(randomQ);
                window.location.hash = `#/q/${randomQ.id}`;
            };

            const handleShare = (q, e) => {
                if (e) e.stopPropagation();
                const shareUrl = `${window.location.origin}${window.location.pathname}#/q/${q.id}`;
                if (navigator.share) {
                    navigator.share({
                        title: q.question,
                        text: `إليك إجابة سؤال: ${q.question} - كنيسة الأنبا شنودة بالزرابي`,
                        url: shareUrl
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(shareUrl);
                    showToast('تم نسخ رابط السؤال إلى الحافظة 📋');
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-cairo">
                    
                    {/* Header */}
                    <header className="sticky top-0 z-40 bg-church-navyDark text-white shadow-xl border-b border-amber-500/20">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16 sm:h-20">
                                
                                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setViewMode('home')}>
                                    <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-church-navyDark font-black shadow-lg shadow-amber-500/20">
                                        <Icon name="cross" className="w-6 h-6 sm:w-7 sm:h-7" />
                                    </div>
                                    <div>
                                        <h1 className="font-extrabold text-sm sm:text-base md:text-lg leading-tight text-amber-300">أسئلة شبابية</h1>
                                        <p className="text-[11px] sm:text-xs text-slate-300 font-medium">كنيسة الأنبا شنودة بالزرابي</p>
                                    </div>
                                </div>

                                <nav className="hidden md:flex items-center gap-1 bg-slate-800/80 p-1.5 rounded-2xl border border-slate-700/50">
                                    <button 
                                        onClick={() => setViewMode('home')} 
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'home' ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}
                                    >
                                        <Icon name="book" className="w-4 h-4" />
                                        <span>جميع الأسئلة</span>
                                    </button>
                                    <button 
                                        onClick={() => setViewMode('favorites')} 
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'favorites' ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}
                                    >
                                        <Icon name="star" className="w-4 h-4" />
                                        <span>المفضلة</span>
                                        {favorites.length > 0 && (
                                            <span className="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-black">
                                                {favorites.length}
                                            </span>
                                        )}
                                    </button>
                                    <button 
                                        onClick={() => { setViewMode('ask'); setAskSuccessMessage(false); }} 
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'ask' ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-amber-300 hover:text-white hover:bg-slate-700/50'}`}
                                    >
                                        <Icon name="send" className="w-4 h-4" />
                                        <span>اسأل سؤالاً</span>
                                    </button>
                                    <button 
                                        onClick={() => {
                                            if (isAdminLoggedIn) setViewMode('admin');
                                            else setShowLoginModal(true);
                                        }}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'admin' ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}
                                    >
                                        <Icon name="settings" className="w-4 h-4" />
                                        <span>لوحة الخدام</span>
                                    </button>
                                </nav>

                                <div className="flex items-center gap-2">
                                    {currentUser ? (
                                        <button 
                                            onClick={() => setViewMode('profile')}
                                            className={`flex items-center gap-2 px-3.5 py-2 rounded-xl border text-xs font-bold transition ${viewMode === 'profile' ? 'bg-amber-500 text-slate-950 border-amber-400' : 'bg-slate-800 text-amber-300 border-amber-500/30 hover:bg-slate-700'}`}
                                        >
                                            <Icon name="user" className="w-4 h-4 text-amber-400" />
                                            <span className="hidden sm:inline">أهلاً، {currentUser.displayName || currentUser.email.split('@')[0]}</span>
                                            <span className="sm:hidden">حسابي</span>
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => { setViewMode('auth'); setAuthMode('login'); setAuthError(''); }}
                                            className="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-2 rounded-xl text-xs font-bold shadow-md transition"
                                        >
                                            <Icon name="user" className="w-4 h-4" />
                                            <span>دخول</span>
                                        </button>
                                    )}

                                    <button

                                            <button 
                                                onClick={() => { setViewMode('ask'); setAskSuccessMessage(false); }}
                                                className="bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 font-bold px-4 py-1.5 rounded-xl transition flex items-center gap-1.5"
                                            >
                                                <Icon name="send" className="w-4 h-4" />
                                                <span>طرح سؤال للخدام</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {questionOfTheDay && !searchQuery && selectedCategory === 'الكل' && (
                                    <div className="bg-gradient-to-r from-amber-500/10 via-amber-500/5 to-transparent border-r-4 border-amber-500 rounded-2xl p-5 sm:p-6 shadow-sm border border-amber-200/60">
                                        <div className="flex items-center justify-between gap-2 mb-2">
                                            <span className="inline-flex items-center gap-1.5 bg-amber-500 text-slate-950 text-xs font-black px-3 py-1 rounded-lg shadow-sm">
                                                <Icon name="sparkles" className="w-3.5 h-3.5" />
                                                <span>سؤال اليوم</span>
                                            </span>
                                            <span className="text-[11px] font-bold text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full">
                                                {questionOfTheDay.category}
                                            </span>
                                        </div>
                                        <h3 
                                            onClick={() => { setActiveQuestion(questionOfTheDay); window.location.hash = `#/q/${questionOfTheDay.id}`; }}
                                            className="text-base sm:text-lg font-bold text-slate-900 hover:text-amber-600 cursor-pointer transition"
                                        >
                                            {questionOfTheDay.question}
                                        </h3>
                                    </div>
                                )}

                                <div className="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar">
                                    <button 
                                        onClick={() => setSelectedCategory('الكل')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-sm ${selectedCategory === 'الكل' ? 'bg-church-navyDark text-amber-300 border border-amber-500/40' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                                    >
                                        الكل
                                    </button>
                                    {categories.map((cat, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-sm ${selectedCategory === cat ? 'bg-church-navyDark text-amber-300 border border-amber-500/40' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {filteredQuestions.map((q) => {
                                        const isFav = favorites.includes(q.id);
                                        return (
                                            <div 
                                                key={q.id}
                                                onClick={() => { setActiveQuestion(q); window.location.hash = `#/q/${q.id}`; }}
                                                className="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80 hover:border-amber-400 hover:shadow-md transition cursor-pointer flex flex-col justify-between group relative"
                                            >
                                                <div className="space-y-3">
                                                    <div className="flex items-center justify-between gap-2">
                                                        <span className="bg-slate-100 text-slate-700 text-[11px] font-bold px-3 py-1 rounded-lg">
                                                            {q.category}
                                                        </span>
                                                        <div className="flex items-center gap-1">
                                                            <button 
                                                                onClick={(e) => toggleFavorite(q.id, e)}
                                                                className={`p-2 rounded-xl transition ${isFav ? 'text-amber-500 bg-amber-50' : 'text-slate-400 hover:text-amber-500 hover:bg-slate-100'}`}
                                                                title="حفظ في المفضلة"
                                                            >
                                                                <Icon name={isFav ? "starFilled" : "star"} className="w-4 h-4" />
                                                            </button>
                                                            <button 
                                                                onClick={(e) => handleShare(q, e)}
                                                                className="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
                                                                title="مشاركة السؤال"
                                                            >
                                                                <Icon name="share" className="w-4 h-4" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                    
                                                    <h3 className="font-extrabold text-base sm:text-lg text-slate-900 group-hover:text-amber-700 transition leading-relaxed">
                                                        {q.question}
                                                    </h3>
                                                    
                                                    <p className="text-slate-600 text-xs sm:text-sm line-clamp-2 leading-relaxed">
                                                        {q.answer}
                                                    </p>
                                                </div>

                                                <div className="pt-4 mt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400 font-medium">
                                                    <span className="text-amber-700 font-bold truncate max-w-[220px]">
                                                        {q.verse || q.source || 'كنيسة الأنبا شنودة بالزرابي'}
                                                    </span>
                                                    <span className="text-slate-500 group-hover:text-amber-600 font-bold flex items-center gap-1">
                                                        <span>اقرأ الإجابة</span>
                                                        <Icon name="arrowLeft" className="w-3.5 h-3.5" />
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {filteredQuestions.length === 0 && (
                                        <div className="col-span-full py-16 text-center space-y-4 bg-white rounded-3xl border border-slate-200">
                                            <div className="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto">
                                                <Icon name="search" className="w-6 h-6" />
                                            </div>
                                            <p className="text-slate-600 font-bold text-sm">عذراً، لم نجد نتائج مطابقة لبحثك.</p>
                                            <button 
                                                onClick={() => { setSearchQuery(''); setSelectedCategory('الكل'); }}
                                                className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs shadow"
                                            >
                                                عرض جميع الأسئلة
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* VIEW: FAVORITES */}
                        {viewMode === 'favorites' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xl sm:text-2xl font-black text-slate-900 flex items-center gap-2">
                                        <Icon name="star" className="w-6 h-6 text-amber-500" />
                                        <span>الأسئلة المحفوظة في المفضلة</span>
                                    </h2>
                                    <span className="bg-amber-100 text-amber-800 text-xs font-extrabold px-3 py-1 rounded-full">
                                        {favorites.length} سؤال
                                    </span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {questions.filter(q => favorites.includes(q.id)).map((q) => (
                                        <div 
                                            key={q.id}
                                            onClick={() => { setActiveQuestion(q); window.location.hash = `#/q/${q.id}`; }}
                                            className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:border-amber-400 transition cursor-pointer space-y-3"
                                        >
                                            <div className="flex items-center justify-between">
                                                <span className="bg-slate-100 text-slate-700 text-[11px] font-bold px-2.5 py-0.5 rounded-md">
                                                    {q.category}
                                                </span>
                                                <button 
                                                    onClick={(e) => toggleFavorite(q.id, e)}
                                                    className="p-2 text-amber-500 bg-amber-50 rounded-xl"
                                                >
                                                    <Icon name="starFilled" className="w-4 h-4" />
                                                </button>
                                            </div>
                                            <h3 className="font-extrabold text-base text-slate-900">{q.question}</h3>
                                            <p className="text-slate-600 text-xs line-clamp-2">{q.answer}</p>
                                        </div>
                                    ))}

                                    {favorites.length === 0 && (
                                        <div className="col-span-full py-16 text-center space-y-4 bg-white rounded-3xl border border-slate-200">
                                            <div className="w-12 h-12 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto">
                                                <Icon name="star" className="w-6 h-6" />
                                            </div>
                                            <p className="text-slate-600 font-bold text-sm">ليس لديك أي أسئلة محفوظة في المفضلة حالياً.</p>
                                            <button 
                                                onClick={() => setViewMode('home')}
                                                className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs shadow"
                                            >
                                                تصفح الأسئلة وحفظ ما يعجبك
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* VIEW: ASK A QUESTION */}
                        {viewMode === 'ask' && (
                            <div className="max-w-2xl mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-100 animate-fade-in space-y-6">
                                <div className="text-center space-y-2">
                                    <div className="w-14 h-14 bg-amber-500/10 text-amber-600 rounded-2xl mx-auto flex items-center justify-center border border-amber-500/20">
                                        <Icon name="send" className="w-7 h-7" />
                                    </div>
                                    <h2 className="text-xl sm:text-2xl font-black text-slate-900">طرح سؤال جديد على خدام الكنيسة</h2>
                                    <p className="text-xs text-slate-500">أرسل سؤالك العقيدي أو الروحي وسيتم الإجابة عليه قريباً</p>
                                </div>

                                {askSuccessMessage ? (
                                    <div className="bg-emerald-50 border-r-4 border-emerald-500 p-6 rounded-2xl text-center space-y-3">
                                        <div className="w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto">
                                            ✓
                                        </div>
                                        <h3 className="font-extrabold text-emerald-900 text-base">تم إرسال سؤالك بنجاح!</h3>
                                        <p className="text-xs text-emerald-700">شكراً لتواصلك. سيقوم خدام الكنيسة بمراجعة السؤال والإجابة عنه في أقرب وقت.</p>
                                        <button 
                                            onClick={() => { setAskSuccessMessage(false); setViewMode('home'); }}
                                            className="px-5 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow"
                                        >
                                            العودة للرئيسية
                                        </button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSubmitVisitorQuestion} className="space-y-4">
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-700">اسمك الكريم</label>
                                            <input 
                                                type="text" 
                                                value={currentUser ? currentUser.displayName : askVisitorName}
                                                onChange={(e) => setAskVisitorName(e.target.value)}
                                                disabled={!!currentUser}
                                                placeholder="اكتب اسمك أو اسم الشهرة..." 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition disabled:opacity-70"
                                            />
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-700">قسم السؤال <span className="text-rose-500">*</span></label>
                                            <select 
                                                value={askCategory}
                                                onChange={(e) => setAskCategory(e.target.value)}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                                required
                                            >
                                                <option value="" disabled>اختر القسم</option>
                                                {categories.map((cat, idx) => (
                                                    <option key={idx} value={cat}>{cat}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-700">نص السؤال <span className="text-rose-500">*</span></label>
                                            <textarea 
                                                rows="4" 
                                                required
                                                value={askQuestionText}
                                                onChange={(e) => setAskQuestionText(e.target.value)}
                                                placeholder="اكتب سؤالك بوضوح هنا..."
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                            ></textarea>
                                        </div>

                                        <button 
                                            type="submit" 
                                            className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm"
                                        >
                                            <Icon name="send" className="w-4 h-4" />
                                            <span>إرسال السؤال للخدام</span>
                                        </button>
                                    </form>
                                )}
                            </div>
                        )}

                    </main>

                    {/* Question Detail Modal / Overlay */}
                    {activeQuestion && (
                        <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100 p-6 sm:p-8 space-y-6">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                                    <span className="bg-amber-100 text-amber-900 font-extrabold text-xs px-3 py-1.5 rounded-xl">
                                        {activeQuestion.category}
                                    </span>
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={(e) => toggleFavorite(activeQuestion.id, e)}
                                            className={`p-2 rounded-xl transition ${favorites.includes(activeQuestion.id) ? 'text-amber-500 bg-amber-50' : 'text-slate-400 hover:bg-slate-100'}`}
                                            title="المفضلة"
                                        >
                                            <Icon name={favorites.includes(activeQuestion.id) ? "starFilled" : "star"} className="w-5 h-5" />
                                        </button>
                                        <button 
                                            onClick={(e) => handleShare(activeQuestion, e)}
                                            className="p-2 rounded-xl text-slate-400 hover:bg-slate-100 transition"
                                            title="مشاركة"
                                        >
                                            <Icon name="share" className="w-5 h-5" />
                                        </button>
                                        <button 
                                            onClick={() => { setActiveQuestion(null); window.location.hash = ''; }}
                                            className="p-2 rounded-xl text-slate-400 hover:bg-slate-100 transition"
                                        >
                                            <Icon name="close" className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <h2 className="text-xl sm:text-2xl font-black text-slate-900 leading-snug">
                                        {activeQuestion.question}
                                    </h2>

                                    <div className="bg-slate-50 rounded-2xl p-5 sm:p-6 border border-slate-200/60 text-slate-700 text-sm sm:text-base leading-relaxed whitespace-pre-line font-medium">
                                        {activeQuestion.answer}
                                    </div>

                                    {activeQuestion.verse && (
                                        <div className="bg-amber-50/80 border-r-4 border-amber-500 p-4 rounded-xl text-amber-900 text-xs sm:text-sm font-bold">
                                            {activeQuestion.verse}
                                        </div>
                                    )}

                                    {activeQuestion.source && (
                                        <p className="text-xs text-slate-400 font-medium pt-2">
                                            المصدر: {activeQuestion.source}
                                        </p>
                                    )}
                                </div>

                                <div className="pt-4 border-t border-slate-100 flex items-center justify-end">
                                    <button 
                                        onClick={() => { setActiveQuestion(null); window.location.hash = ''; }}
                                        className="px-6 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold shadow hover:bg-slate-800 transition"
                                    >
                                        إغلاق
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Admin Login Modal */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-5">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h3 className="font-black text-slate-900 text-base">دخول لوحة الخدام</h3>
                                        <p className="text-[11px] text-slate-500 mt-1">استخدم حساب Firebase المصرح له كمسؤول.</p>
                                    </div>
                                    <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="close" className="w-5 h-5" />
                                    </button>
                                </div>

                                {adminLoginError && (
                                    <p className="text-xs font-bold text-rose-600 bg-rose-50 border border-rose-100 rounded-xl p-3">{adminLoginError}</p>
                                )}

                                <form onSubmit={handleAdminLogin} className="space-y-3">
                                    <input
                                        type="email"
                                        autoFocus
                                        required
                                        value={adminEmail}
                                        onChange={(e) => setAdminEmail(e.target.value)}
                                        placeholder="البريد الإلكتروني الإداري..."
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                    />
                                    <input
                                        type="password"
                                        required
                                        value={adminPassword}
                                        onChange={(e) => setAdminPassword(e.target.value)}
                                        placeholder="كلمة المرور..."
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                    />
                                    <button type="submit" disabled={adminLoginLoading} className="w-full bg-amber-500 hover:bg-amber-400 disabled:opacity-60 text-slate-950 font-extrabold py-3 rounded-xl shadow transition text-xs">
                                        {adminLoginLoading ? 'جاري التحقق...' : 'دخول لوحة الخدام'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Edit Question Modal */}
                    {editingQuestion && (
                        <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-3xl max-w-xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100 p-6 sm:p-8 space-y-6">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                                    <h3 className="font-black text-slate-900 text-lg">تعديل السؤال</h3>
                                    <button onClick={() => setEditingQuestion(null)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="close" className="w-5 h-5" />
                                    </button>
                                </div>
                                <form onSubmit={handleUpdateQuestion} className="space-y-4">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-700">القسم <span className="text-rose-500">*</span></label>
                                        <select 
                                            value={editingQuestion.category}
                                            onChange={(e) => setEditingQuestion({...editingQuestion, category: e.target.value})}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                            required
                                        >
                                            <option value="" disabled>اختر القسم</option>
                                            {categories.map((cat, idx) => (
                                                <option key={idx} value={cat}>{cat}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-700">نص السؤال <span className="text-rose-500">*</span></label>
                                        <input 
                                            type="text" 
                                            required
                                            value={editingQuestion.question}
                                            onChange={(e) => setEditingQuestion({...editingQuestion, question: e.target.value})}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                        />
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-700">الإجابة <span className="text-rose-500">*</span></label>
                                        <textarea 
                                            rows="4" 
                                            required
                                            value={editingQuestion.answer}
                                            onChange={(e) => setEditingQuestion({...editingQuestion, answer: e.target.value})}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                        ></textarea>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-700">آية مقدسة</label>
                                            <input 
                                                type="text" 
                                                value={editingQuestion.verse || ''}
                                                onChange={(e) => setEditingQuestion({...editingQuestion, verse: e.target.value})}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                            />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold/slate-700">المرجع / المصدر</label>
                                            <input 
                                                type="text" 
                                                value={editingQuestion.source || ''}
                                                onChange={(e) => setEditingQuestion({...editingQuestion, source: e.target.value})}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                            />
                                        </div>
                                    </div>

                                    <div className="pt-2 flex items-center justify-end gap-3">
                                        <button type="button" onClick={() => setEditingQuestion(null)} className="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold hover:bg-slate-200">
                                            إلغاء
                                        </button>
                                        <button type="submit" className="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold shadow">
                                            حفظ التعديلات
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <ConfirmModal 
                        isOpen={confirmState.isOpen}
                        title={confirmState.title}
                        message={confirmState.message}
                        onConfirm={confirmState.onConfirm}
                        onCancel={() => setConfirmState({ isOpen: false })}
                    />

                    <Toast message={toastMessage} />

                    <footer className="bg-church-navyDark text-slate-400 text-center py-6 mt-auto border-t border-slate-800 text-xs">
                        <div className="max-w-7xl mx-auto px-4 space-y-1">
                            <p className="font-bold text-slate-300">منصة الأسئلة الشبابية - كنيسة الأنبا شنودة بالزرابي</p>
                            <p className="text-[11px] text-slate-500">جميع الحقوق محفوظة © {new Date().getFullYear()} - إعداد خدام الكنيسة</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.Section = null; // Clean up placeholder if any
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
