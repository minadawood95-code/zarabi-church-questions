swer:"الصلاة للقديسين ليست عبادة لهم، بل هي طلب شفاعة وسؤال ليشاركونا الصلاة أمام عرش النعمة. القديسون أحياء في السماء كما قال السيد المسيح: «ليس هو إله أموات بل إله أحياء» (متى 22: 32). نحن نطلب صلواتهم كما نطلب من أخوتنا في الأرض أن يصلوا لأجلنا، ولكن لشفاعتهم دالة عظيمة أمام الله.",category:"العقيدة الأرثوذكسية",verse:"«صَلاَةُ الْبَارِّ تَقْتَدِرُ كَثِيرًا فِي فِعْلِهَا» (يعقوب 5: 16)",source:"كتاب الرد على شبهات حول الشفاعة - البابا شنودة الثالث",keywords:"شفاعة, صلاة, قديسين, عقيدة, أورثوذكسية"},{id:"2",question:"ليه بنسمي العذراء مريم «والدة الإله» (الفيوتوكوس)؟",answer:"لقب «والدة الإله» (بالقبطية: ϮⲐⲉⲟⲧⲟⲕⲟⲥ) أُقر في مجمع أفسس المسكوني سنة 431 م برئاسة القديس كيرلس الكبير. المعنى العقيدي هو أن المولود منها هو إله متجسد، أقنوم الكلمة الذي أخذ جسداً حقيقياً. العذراء لم تلد اللاهوت من حيث أزليته، بل ولدت كلمة الله متجسداً في الزمان.",category:"السيدة العذراء",verse:"«فَمِنْ أَيْنَ لِي هذَا أَنْ تَأْتِيَ أُمُّ رَبِّي إِلَيَّ؟» (لوقا 1: 43)",source:"كتاب السيدة العذراء مريم - البابا شنودة الثالث",keywords:"العذراء, ثيؤطوكوس, تجسد, مجمع أفسس"},{id:"3",question:"إيه أهمية الصوم في حياتنا الروحية وليه بنصوم أيام كثيرة؟",answer:"الصوم ليس مجرد تغيير في نوع الطعام، بل هو ضبط للجسد ولالرادة وتقوية للروح. الصوم يساعد الإنسان على التوبة، والتقرب إلى الله بالصلاة، والشعور بالفقراء. السيد المسيح نفسه صام 40 يوماً وقال: «هذَا الْجِنْسُ لاَ يَخْرُجُ إِلاَّ بِالصَّلاَةِ وَالصَّوْمِ» (متى 17: 21).",category:"الأصوام والوسائط الروحية",verse:"«وَلَكِنْ مَتَى صُمْتُمْ فَلاَ تَكُونُوا مُعَبِّسِينَ كَالْمُرَائِينَ» (متى 6: 16)",source:"كتاب حياة الصوم - البابا شنودة الثالث",keywords:"صوم, حياة روحية, توبة, انضباط"},{id:"4",question:"كيف أقوم بقراءة الكتاب المقدس بفهم واستفادة شخصية؟",answer:`1. ابدأ بصلاة قصيرة: «أنر يا رب عينيَّ لأفهم عجائب من شريعتك».
