                                        const aTime = a.createdAt ? new Date(a.createdAt).getTime() : 0;

                                        return bTime - aTime;
                                    });

                            (error) => {

            const compressBrandingImage = (file) => new Promise((resolve, reject) => {
                if (!file || !file.type.startsWith('image/')) { reject(new Error('الملف ليس صورة.')); return; }
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const maxSize = 512;
                            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.max(1, Math.round(img.width * scale));
                            canvas.height = Math.max(1, Math.round(img.height * scale));
                            const ctx = canvas.getContext('2d');
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/webp', 0.86));
                        } catch (error) { reject(error); }
                    };
                    img.onerror = () => reject(new Error('تعذر قراءة الصورة.'));
                    img.src = reader.result;
                };
                reader.onerror = () => reject(new Error('تعذر قراءة الملف.'));
                reader.readAsDataURL(file);
            });

                if (!ms) return '';
                const d = new Date(Number(ms));
                if (Number.isNaN(d.getTime())) return '';
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };

                                    </button>
                                </div>

                                {adminLoginError && (
                                    <p className="text-xs font-bold text-rose-600 bg-rose-50 border border-rose-100 rounded-xl p-3">{adminLoginError}</p>
                                )}

                                <form onSubmit={handleAdminLogin} className="space-y-3">
                                    <input
                                        type="email"
                                        autoFocus
                                        required
                                        value={adminEmail}
                                        onChange={(e) => setAdminEmail(e.target.value)}
                                        placeholder="البريد الإلكتروني الإداري..."
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                    />
                                    <input
                                        type="password"
                                        required
                                        value={adminPassword}
                                        onChange={(e) => setAdminPassword(e.target.value)}
                                        placeholder="كلمة المرور..."
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                    />
                                    <button type="submit" disabled={adminLoginLoading} className="w-full bg-amber-500 hover:bg-amber-400 disabled:opacity-60 text-slate-950 font-extrabold py-3 rounded-xl shadow transition text-xs">
                                        {adminLoginLoading ? 'جاري التحقق...' : 'دخول لوحة الخدام'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Edit Question Modal */}
                    {editingQuestion && (
                        <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-3xl max-w-xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100 p-6 sm:p-8 space-y-6">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                                    <h3 className="font-black text-slate-900 text-lg">تعديل السؤال</h3>
                                    <button onClick={() => setEditingQuestion(null)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="close" className="w-5 h-5" />
                                    </button>
                                </div>
                                <form onSubmit={handleUpdateQuestion} className="space-y-4">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-700">القسم <span className="text-rose-500">*</span></label>
                                        <select 
                                            value={editingQuestion.category}
                                            onChange={(e) => setEditingQuestion({...editingQuestion, category: e.target.value})}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                            required
                                        >
                                            <option value="" disabled>اختر القسم</option>
                                            {categories.map((cat, idx) => (
                                                <option key={idx} value={cat}>{cat}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-700">نص السؤال <span className="text-rose-500">*</span></label>
                                        <input 
                                            type="text" 
                                            required
                                            value={editingQuestion.question}
                                            onChange={(e) => setEditingQuestion({...editingQuestion, question: e.target.value})}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                        />
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-700">الإجابة <span className="text-rose-500">*</span></label>
                                        <textarea 
                                            rows="4" 
                                            required
                                            value={editingQuestion.answer}
                                            onChange={(e) => setEditingQuestion({...editingQuestion, answer: e.target.value})}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                        ></textarea>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-700">آية مقدسة</label>
                                            <input 
                                                type="text" 
                                                value={editingQuestion.verse || ''}
                                                onChange={(e) => setEditingQuestion({...editingQuestion, verse: e.target.value})}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                            />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold/slate-700">المرجع / المصدر</label>
                                            <input 
                                                type="text" 
                                                value={editingQuestion.source || ''}
                                                onChange={(e) => setEditingQuestion({...editingQuestion, source: e.target.value})}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition"
                                            />
                                        </div>
                                    </div>

                                    <div className="pt-2 flex items-center justify-end gap-3">
                                        <button type="button" onClick={() => setEditingQuestion(null)} className="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold hover:bg-slate-200">
                                            إلغاء
                                        </button>
                                        <button type="submit" className="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold shadow">
                                            حفظ التعديلات
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                {showAffiliationModal && pendingQuiz && (
                    <div className="fixed inset-0 z-[70] bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-200 p-6 sm:p-8" dir="rtl">
                            <div className="text-center">
                                <div className="w-16 h-16 rounded-2xl bg-amber-50 text-amber-700 flex items-center justify-center mx-auto border border-amber-200"><Icon name="user" className="w-7 h-7" /></div>
                                <h3 className="text-lg sm:text-xl font-black text-slate-900 mt-4">اختر الجهة التابعة لها</h3>
                                <p className="text-xs text-slate-500 mt-2 leading-6">قبل بداية المسابقة، اختر الاجتماع أو الخدمة التي تتبع لها.</p>
                            </div>
                            <div className="mt-5 space-y-2.5">
                                {(pendingQuiz.affiliations || []).map((affiliation) => <button key={affiliation} type="button" onClick={() => { setSelectedQuizAffiliation(affiliation); startQuizNow(pendingQuiz, affiliation); }} className={`w-full text-right px-4 py-3 rounded-xl border transition font-bold text-sm ${selectedQuizAffiliation === affiliation ? 'border-amber-500 bg-amber-50 text-amber-900' : 'border-slate-200 bg-slate-50 hover:border-amber-300 hover:bg-amber-50'}`}>{affiliation}</button>)}
                            </div>
                            <button type="button" onClick={() => { setShowAffiliationModal(false); setPendingQuiz(null); setSelectedQuizAffiliation(''); }} className="w-full mt-4 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">إلغاء</button>
                        </div>
                    </div>
                )}

                    <ConfirmModal
                        isOpen={confirmState.isOpen}
                        title={confirmState.title}
                        message={confirmState.message}
                        onConfirm={confirmState.onConfirm}
                        onCancel={() => setConfirmState({ isOpen: false })}
                    />

                    <Toast message={toastMessage} />

                    <footer className="bg-church-navyDark text-slate-400 text-center py-6 mt-auto border-t border-slate-800 text-xs">
                        <div className="max-w-7xl mx-auto px-4 space-y-2">
                            <p className="font-bold text-slate-300">منصة الأسئلة الشبابية - كنيسة الأنبا شنودة بالزرابي</p>
                            <p className="text-[11px] text-slate-500">جميع الحقوق محفوظة © {new Date().getFullYear()} - إعداد خدام الكنيسة</p>
                            <div className="pt-2">
                                <p className="text-[11px] font-bold text-amber-300/90">تم تطويره بواسطة م. مينا داود رمزي</p>
                                <p className="text-[10px] text-slate-500 mt-0.5">Developed By Eng: Mina Dawood</p>
                                <p className="text-[10px] text-slate-400 mt-0.5" dir="ltr">01222430586</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        }
    </script>
</body>
</html>
